<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extra/spring-security" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Site Actualités</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <h2 class="text-center mb-4">Les dernières actualités</h2>

    <div class="card mb-3"
         th:each="article : ${articles}">

        <div class="card-body">

            <h3>
                <a th:href="@{/article/{id}(id=${article.id})}"
                   th:text="${article.titre}">
                </a>
            </h3>

            <span class="badge bg-primary mb-2" th:text="${article.categorie.libelle}"></span>

            <p th:text="${#strings.abbreviate(article.contenu, 150)}"></p>

            <small class="text-primary-emphasis"
                   th:text="${#temporals.format(article.datePublication,'dd/MM/yyyy HH:mm')}">
            </small>

        </div>

    </div>

    <div class="d-flex justify-content-between mt-4">

        <a class="btn btn-primary"
           th:if="${pagePrecedente}"
           th:href="@{/(page=${pageCourante-1})}">
            ← Précédent
        </a>

        <span></span>

        <a class="btn btn-primary"
           th:if="${pageSuivante}"
           th:href="@{/(page=${pageCourante+1})}">
            Suivant →
        </a>

    </div>

</div>

</body>
</html>
