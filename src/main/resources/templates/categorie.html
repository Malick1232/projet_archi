<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title th:text="${categorie.libelle}">Catégorie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">

    <a th:href="@{/}" class="btn btn-outline-primary mb-3">← Accueil</a>

    <h1 class="mb-1" th:text="${categorie.libelle}"></h1>
    <p class="text-primary-emphasis" th:text="${categorie.description}"></p>

    <div class="card mb-3" th:each="article : ${articles}">
        <div class="card-body">
            <h3>
                <a th:href="@{/article/{id}(id=${article.id})}" th:text="${article.titre}"></a>
            </h3>
            <span class="badge bg-primary mb-2" th:text="${categorie.libelle}"></span>
            <p th:text="${#strings.abbreviate(article.contenu, 150)}"></p>
            <small class="text-primary-emphasis"
                   th:text="${#temporals.format(article.datePublication,'dd/MM/yyyy HH:mm')}"></small>
        </div>
    </div>

    <div class="d-flex justify-content-between mt-4">
        <a class="btn btn-primary" th:if="${pagePrecedente}"
           th:href="@{/categorie/{id}(id=${categorie.id}, page=${pageCourante-1})}">← Précédent</a>
        <span></span>
        <a class="btn btn-primary" th:if="${pageSuivante}"
           th:href="@{/categorie/{id}(id=${categorie.id}, page=${pageCourante+1})}">Suivant →</a>
    </div>

</div>
</body>
</html>
