<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Utilisateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">

    <h1 th:text="${utilisateur.id == null} ? 'Nouvel utilisateur' : 'Modifier un utilisateur'"></h1>

    <form th:action="@{/admin/utilisateurs}" th:object="${utilisateur}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Nom</label>
            <input type="text" class="form-control" th:field="*{nom}" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Prénom</label>
            <input type="text" class="form-control" th:field="*{prenom}" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Login</label>
            <input type="text" class="form-control" th:field="*{login}" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Rôle</label>
            <select class="form-select" th:field="*{role}" required>
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" class="form-control" name="motDePasseClair"
                   th:required="${utilisateur.id == null}"/>
            <small class="text-primary-emphasis" th:if="${utilisateur.id != null}">
                Laisser vide pour conserver le mot de passe actuel.
            </small>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/admin/utilisateurs}" class="btn btn-outline-primary">Annuler</a>

    </form>

</div>
</body>
</html>
