<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Article</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">

    <h1 th:text="${article.id == null} ? 'Nouvel article' : 'Modifier l&#39;article'"></h1>

    <form th:action="@{/editeur/articles}" th:object="${article}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Titre</label>
            <input type="text" class="form-control" th:field="*{titre}" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Catégorie</label>
            <select class="form-select" th:field="*{categorie}" required>
                <option value="">-- Choisir --</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.libelle}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Résumé</label>
            <textarea class="form-control" rows="2" maxlength="500" th:field="*{resume}" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Contenu</label>
            <textarea class="form-control" rows="8" th:field="*{contenu}" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/editeur/articles}" class="btn btn-outline-primary">Annuler</a>

    </form>

</div>
</body>
</html>
