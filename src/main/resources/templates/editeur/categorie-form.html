<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Catégorie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">

    <h1 th:text="${categorie.id == null} ? 'Nouvelle catégorie' : 'Modifier la catégorie'"></h1>

    <form th:action="@{/editeur/categories}" th:object="${categorie}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Libellé</label>
            <input type="text" class="form-control" th:field="*{libelle}" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/editeur/categories}" class="btn btn-outline-primary">Annuler</a>

    </form>

</div>
</body>
</html>
