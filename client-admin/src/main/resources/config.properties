# Jeton d'authentification à utiliser pour les opérations SOAP protégées.
# En mode Mock, la valeur ci-dessous ("TOKEN-TEST-1234") est acceptée.
# En mode réel, demande à l'administrateur (rôle 1) de générer un jeton
# depuis la page d'admin du site, puis colle-le ici.
jeton=123456789abcdef123456789abcdef123456789abcdef123456789abcdef1234

# URL du WSDL exposé par le service SOAP (rôle 2), pour référence.
soap.wsdl.url=http://localhost:8080/ws/utilisateurs.wsdl
